          """
          import base64, hashlib, json, os, subprocess, time, zlib
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          data = json.loads(zlib.decompress(base64.b64decode(PACKED)))
          project = 'JakeShieldsTryingToSpell/carlson-osint'
          assert os.environ['GITHUB_REPOSITORY'] == project
          prefix = 'https://api.github.com/repos/' + project
          headers = {'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'User-Agent':'carlson-research-desk'}
          def api(path, method='GET', body=None):
              req = Request(prefix+path, data=json.dumps(body).encode() if body is not None else None, headers=headers, method=method)
              for attempt in range(4):
                  try:
                      with urlopen(req,timeout=45) as res:
                          out = res.read()
                      if method != 'GET':
                          time.sleep(1.5)
                      return json.loads(out) if out else None
                  except HTTPError as exc:
                      message = exc.read().decode()[:900]
                      if exc.code in (403,429) and ('rate limit' in message.lower() or exc.headers.get('Retry-After')) and attempt<3:
                          time.sleep(max(60,int(exc.headers.get('Retry-After',60))))
                          continue
                      raise RuntimeError(f'{method} {path} {exc.code} {message}') from exc
          def paged(path):
              out=[]
              for page in range(1,30):
                  batch=api(path+('&' if '?' in path else '?')+f'per_page=100&page={page}')
                  out.extend(batch)
                  if len(batch)<100: return out
              raise ValueError('Unexpected pagination')
          def git(*args): return subprocess.run(['git',*args],check=True,capture_output=True,text=True).stdout.strip()

          for n, content in data['files'].items():
              p=Path(n)
              assert n in ('AGENTS.md','DESK.md','README.md') or (p.parent==Path('cases') and p.suffix=='.md')
              assert hashlib.sha256(p.read_bytes()).hexdigest()==data['before'][n] or p.read_text()==content, 'Concurrent edit '+n
              p.write_text(content)
          subprocess.run(['python3','archive.py','check'],check=True)
          review = api('/pulls/6')
          assert review['state']=='open' and review['user']['login']=='Patriot117'
          originals = data['source_map']
          existing={i['number']:i for i in paged('/issues?state=all') if 'pull_request' not in i}
          all_comments=paged('/issues/comments?')
          for n in originals:
              old=existing[int(n)]
              if old['state']=='open':
                  assert not old['assignees'], 'New assignee: '+n
                  comments=[c for c in all_comments if c['issue_url'].endswith('/'+n)]
                  for c in comments:
                      known=n=='4' and c['user']['login']=='Patriot117' and c['body'] in ('Archive claim 44f27d423562478ea4aeb9ed233ee76e','Archive review 44f27d423562478ea4aeb9ed233ee76e')
                      assert known or '<!-- desk-reassigned-20261127 -->' in c['body'], 'New activity on '+n

          known_labels={x['name'] for x in paged('/labels')}
          for name,color in data['labels'].items():
              if name not in known_labels:
                  api('/labels','POST',dict(name=name,color=color))
          ids={}
          for item in data['tasks']:
              key=item['key']
              mark=f'<!-- archive-queue-20261127:{key} -->'
              same=[i for i in existing.values() if mark in (i['body'] or '')]
              assert len(same)<2
              if same:
                  issue=same[0]
              else:
                  fields={k:item[k] for k in ('title','body','labels')}
                  if key=='rockreview':
                      fields['body']=fields['body'].replace('948e1a574c5cc2bb772737dbe87e534bd48b1a43',review['head']['sha'])
                  issue=api('/issues','POST',fields)
              assert issue['state']=='open' and issue['title']==item['title']
              assert set(item['labels']) <= {label['name'] for label in issue['labels']}
              ids[key]=issue['number']
              print(key,issue['number'],flush=True)
          assert len(set(ids.values()))==len(data['tasks'])
          git('config','user.name','github-actions[bot]')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('add','--',*data['files'])
          if git('diff','--staged','--name-only'):
              git('commit','-m','Rebuild the research desk and contributor instructions around live assignments')
              git('push','origin','HEAD:refs/heads/refresh-research-desk')
          for n,keys in originals.items():
              old=api('/issues/'+n)
              if old['state']!='open': continue
              comments=paged('/issues/'+n+'/comments')
              if old['assignees'] or len(comments)!=old['comments']:
                  raise RuntimeError('Concurrent change on '+n)
              mark='<!-- desk-reassigned-20261127 -->'
              seen=any(mark in c['body'] for c in comments)
              for c in comments:
                  assert any(c['id']==prev['id'] and c['updated_at']==prev['updated_at'] for prev in all_comments) or mark in c['body'], 'New activity on '+n
              if not seen:
                  refs=', '.join('#'+str(ids[key]) for key in keys)
                  note='The research desk has moved this work to '+refs+'. This thread remains available for its sources and prior attempts.'
                  if n in ('4','7'):
                      note+=' The submitted audit stays with PR #6. Its independent review continues in #'+str(ids['rockreview'])+'.'
                  if n=='5': note+=' The existing grandmother claim remains in the archive. The successor is a broader profile assignment.'
                  api('/issues/'+n+'/comments','POST',{'body':note+'\n\n'+mark})
              api('/issues/'+n,'PATCH',{'state':'closed','state_reason':'not_planned'})
          live=paged('/issues?state=open')
          assert all(i in {x['number'] for x in live} for i in ids.values())
          assert all(int(n) not in {x['number'] for x in live} for n in originals)
          assert api('/pulls/6')['state']=='open'
          print('Verified',len(ids),'assignments and',len(originals),'retirements.')
