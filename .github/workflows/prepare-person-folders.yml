        run: |
          python3 archive.py check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- people cases documents README.md AGENTS.md DESK.md DIRECTORY.md archive.py
          git commit -m 'Organize all 27 people into profile, research and evidence folders'
          git push origin HEAD:refs/heads/person-folders
