          """
          before, files = json.loads(zlib.decompress(base64.b64decode(packed)))
          for name, content in files.items():
              target = Path(name)
              assert not target.is_absolute() and '..' not in target.parts
              assert target.suffix == '.md' and (target.parts[0] in {'cases','people'} or name in {'AGENTS.md','DESK.md','README.md'})
              old = hashlib.sha256(target.read_bytes()).hexdigest() if target.is_file() else None
              assert old == before[name], 'Concurrent edit: ' + name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')
          rows = re.findall(r'^\| \[.*?\]\(([^)]+\.md)\) \|', Path('cases/README.md').read_text(), re.M)
          assert len(rows) == len(set(rows)) == 9
          assert all((Path('cases')/p).is_file() for p in rows)
